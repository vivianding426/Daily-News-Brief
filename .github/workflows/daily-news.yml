name: Daily News Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  send-news-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade openai

      - name: Generate and send brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSBRIEF_SMTP_USER: ${{ secrets.NEWSBRIEF_SMTP_USER }}
          NEWSBRIEF_SMTP_PASS: ${{ secrets.NEWSBRIEF_SMTP_PASS }}
          NEWSBRIEF_TO: ${{ secrets.NEWSBRIEF_TO }}
        run: python scripts/cloud_brief.py

      - name: Save archive and cache changes
        run: |
          git config user.name "news-brief-bot"
          git config user.email "news-brief-bot@users.noreply.github.com"
          git add archive data
          git diff --cached --quiet || git commit -m "Archive daily news brief"
          git push
